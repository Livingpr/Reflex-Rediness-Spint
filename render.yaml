# Render Blueprint - lets you deploy the whole app (web service + database)
# in one go via https://dashboard.render.com/blueprints
#
# This wires up Render's own free Postgres by default. If you'd rather use
# an external provider like Neon (recommended if you want the database to
# outlive Render's 30-day free-tier expiry), skip the `databases` block and
# see "Using an external database" in README.md instead - you'd then just
# set DATABASE_URL manually in the Render dashboard.

services:
  - type: web
    name: reflex
    runtime: node
    plan: free
    branch: main
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: reflex-db
          property: connectionString

databases:
  - name: reflex-db
    plan: free
    postgresMajorVersion: "16"
